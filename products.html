<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objekte – Feuerwehrmuseum</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="products-page">

<header class="top-bar">
  <a href="index.html" class="back-btn">←</a>
  <span class="top-title">Feuerwehrmuseum</span>
</header>

<!-- Buttons -->
<div class="action-btns">
  <button class="pill-btn" onclick="openAR()">Im Raum ansehen</button>
  <button class="pill-btn" onclick="openVideo()">Video ansehen</button>
</div>

<!-- Modell -->
<div class="model-display">
  <a rel="ar" href="resources/feuerloescher_hand.usdz" id="ar-link">
    <img id="model-img" src="resources/feuerloescher_hand.jpg" class="model-img">
  </a>

  <!-- Labels (Beschreibung) -->
  <div class="label-overlay" id="labels" style="display:none">
    <span class="label" style="top:18%;left:62%">Ventil</span>
    <span class="label" style="top:35%;left:8%">Schlauch</span>
    <span class="label" style="top:55%;left:10%">Etikett</span>
    <span class="label" style="top:60%;left:65%">Behälter</span>
  </div>
</div>

<!-- Beschreibung Text -->
<div style="padding:16px; text-align:center;">
  <p id="description-text">
    Wähle eine Epoche, um mehr Informationen zu sehen.
  </p>
</div>

<!-- TOGGLES -->
<div class="toggle-row">

  <div class="toggle-item">
    <span class="toggle-label">Beschreibung</span>
    <label class="toggle-switch">
      <input type="checkbox" onchange="toggleDesc(this)">
      <span class="slider-thumb"></span>
    </label>
  </div>

  <div class="toggle-item">
    <span class="toggle-label">Funktionsweise</span>
    <label class="toggle-switch">
      <input type="checkbox" onchange="toggleSteps(this)">
      <span class="slider-thumb"></span>
    </label>
  </div>

</div>

<!-- 🔥 FUNKTIONSWEISE DIREKT HIER -->
<div id="steps-text" style="
  display:none;
  padding:14px;
  background:#1e1e1e;
  border-radius:10px;
  margin:8px 12px;
  color:#ddd;
  line-height:1.5;
  font-size:14px;
"></div>

<!-- EPOCH -->
<div class="epoch-bar">

<button class="epoch-btn active" onclick="setEpoch(this,
'resources/feuerloescher_hand.jpg',
'resources/feuerloescher_hand.usdz',
'Ein früher CO₂-Feuerlöscher mit einfacher mechanischer Konstruktion.',
'Zuerst wird der Sicherungsstift entfernt. Danach wird der Hebel gedrückt, wodurch das CO₂ austritt und das Feuer gelöscht wird.'
)">1920</button>

<button class="epoch-btn" onclick="setEpoch(this,
'resources/feuerloescher_chrom.jpg',
'resources/feuerloescher_chrom.usdz',
'Verbesserte Bauweise mit stabilerem Gehäuse.',
'Das Löschmittel wird gleichmässig ausgestossen, wodurch das Feuer gezielter bekämpft werden kann.'
)">1929</button>

<button class="epoch-btn" onclick="setEpoch(this,
'resources/feuerloescher_rot.jpg',
'resources/feuerloescher_rot.usdz',
'Nachkriegsmodell mit effizienter Technik.',
'Nach dem Aktivieren tritt das Löschmittel kontrolliert aus und erhöht die Löschwirkung.'
)">1948</button>

<button class="epoch-btn" onclick="setEpoch(this,
'resources/feuerloescher_anhang.jpg',
'resources/feuerloescher_anhang.usdz',
'Modell mit flexiblem Schlauchsystem.',
'Der Schlauch wird auf das Feuer gerichtet und ermöglicht präzises Löschen auch an schwierigen Stellen.'
)">1952</button>

<button class="epoch-btn" onclick="setEpoch(this,
'resources/feuerloescher_blau.jpg',
'resources/feuerloescher_blau.usdz',
'Modernes Modell mit höherer Sicherheit.',
'Ein integriertes Drucksystem sorgt für einen gleichmässigen Ausstoss und schnelle Brandbekämpfung.'
)">1960</button>

</div>

<!-- VIDEO -->
<div class="overlay" id="video-overlay" style="display:none;">
  <div class="overlay-content">

    <button class="overlay-close-btn" onclick="closeVideo()">Video beenden</button>

    <div style="
      background:black;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      color:white;
    ">
      <div style="font-size:18px;">Produktvideo</div>
      <div style="font-size:13px; opacity:0.7; margin-top:10px;">
        Hier würde ein Video gezeigt werden.
      </div>
      <div style="font-size:36px; margin-top:15px;">▶</div>
    </div>

  </div>
</div>

<script>

function setEpoch(btn, img, usdz, desc, steps) {
  document.querySelectorAll('.epoch-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('model-img').src = img;
  document.getElementById('ar-link').href = usdz;

  document.getElementById('description-text').innerText = desc;
  document.getElementById('steps-text').innerText = steps;
}

function toggleDesc(toggle) {
  const labels = document.getElementById('labels');
  labels.style.display = toggle.checked ? 'block' : 'none';
}

function toggleSteps(toggle) {
  const steps = document.getElementById('steps-text');
  steps.style.display = toggle.checked ? 'block' : 'none';
}

function openAR() {
  document.getElementById('ar-link').click();
}

function openVideo() {
  document.getElementById('video-overlay').style.display = 'flex';
}

function closeVideo() {
  document.getElementById('video-overlay').style.display = 'none';
}

window.onload = function() {
  document.querySelector('.epoch-btn.active').click();
};

</script>

</body>
</html>
